spring:
  datasource:
    url: jdbc:mysql://localhost:3306/microservicio-gestion-inventario?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: emiliocapo23@gmail.com
    password: ${EMAIL_PASSWORD}
    urlFront: http://localhost:5173/recuperar/

logging:
  level:
    org.hibernate.SQL: debug

security:
  jwt:
    secret: ${JWT_SECRET}


jasypt:
  encryptor:
    iv-generator-classname: org.jasypt.iv.NoIvGenerator
    algorithm: PBEWithMD5AndTripleDES


cors:
  origins:
    - http://localhost:5173

api:
  uri:
    basePath: /api
    domain:
      auth: /auth
      proveedor: /proveedor
      clientes: /clientes
      productos: /productos
      movimientos: /movimientos
      gastos: /gastos
      ventas: /ventas

