version: '3'

services:
  api-gestion-inventario:
    container_name: API_GESTION_INVENTARIO
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "jdbc:mysql://microservicio-gestion-inventario:3306/microservicio-gestion-inventario?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires"
      DB_USER_NAME: ${DATABASE_USERNAME}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - microservicio-gestion-inventario

  microservicio-gestion-inventario:
    container_name: microservicio-gestion-inventario
    image: "mysql:8.0.32"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}  
      MYSQL_DATABASE: microservicio-gestion-inventario         
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}       
    restart: always

volumes:
  mysql-data:
    external: false

